<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover permite que el fondo use toda la pantalla en iPhones modernos[cite: 1] -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LINK_UP</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Variables para manejar las zonas seguras de iOS[cite: 1] */
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #fff;
      color: #000;
      -webkit-font-smoothing: antialiased;
    }

    /* BOTÓN IDIOMA - Ajustado a Safe Area[cite: 1] */
    #btn-idioma {
      position: fixed;
      top: var(--safe-top);
      right: 20px;
      z-index: 100;
      background: white;
      color: black;
      border: 1px solid black;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: 0.3s;
    }
    #btn-idioma:hover { background: #000; color: #fff; }

    .hero {
      width: 100%;
      height: 100vh;
      background-image: url('img/portada metro.png');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* FLECHA - Ajustada a Safe Area[cite: 1] */
    .back-arrow {
      position: absolute;
      top: var(--safe-top);
      left: 20px;
      font-size: 2rem;
      color: white;
      text-decoration: none;
      z-index: 10;
    }

    .contenido {
      padding: 4rem 1.5rem;
      max-width: 800px;
      margin: 0 auto;
      font-weight: 400;
      line-height: 1.6;
    }

    .final-section {
      background: white;
      text-align: center;
      width: 100%;
      padding: 4rem 1.5rem calc(var(--safe-bottom) + 2rem);
      box-sizing: border-box;
    }

    .final-section h1 {
      font-family: 'Montserrat', sans-serif;
      color: black;
      font-size: clamp(2.5rem, 8vw, 4rem);
      margin-bottom: 2rem;
    }

    .video-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    video {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    @media (max-width: 768px) {
      .contenido { text-align: center; }
      .hero { height: 60vh; } /* Reducido en móvil para mejor scroll */
    }
  </style>
</head>
<body>

  <button id="btn-idioma">EN</button>
  <a href="PROYECTOS.html" class="back-arrow">←</a>

  <div class="hero"></div>

  <div class="contenido">
    <p>
      <strong data-key="tech-type">INTRO DE VIDEO MUSICAL MOTION GRAPHIC</strong> <BR> <BR>
      <strong data-key="tech-title-label">TÍTULO:</strong> LINK UP "Lyrics Video" <br>
      <strong data-key="tech-creator-label">CREADO POR:</strong> ARANZA ESPINOSA <br>
      <strong data-key="tech-soft-label">SOFTWARES:</strong> ADOBE AFTER EFFECTS, ADOBE ILLUSTRATOR, ADOBE PHOTOSHOP <br>
      <strong data-key="tech-year-label">AÑO:</strong> 2024 <br><br>
      <strong data-key="rights-label">Derechos: © Sony Pictures (Spider-Man: Across the Spider-Verse) y Metro Boomin.</strong>
    </p>
  </div>

  <section class="final-section">
    <h1 data-key="section-video">VIDEO</h1>
    <div class="video-container">
      <video controls playsinline>
        <source src="VÍDEO MP4.mp4" type="video/mp4">
        Tu navegador no soporta la reproducción de video.
      </video>
    </div>
  </section>

  <script>
    const textos = {
      es: {
        "tech-type": "INTRO DE VIDEO MUSICAL MOTION GRAPHIC",
        "tech-title-label": "TÍTULO:",
        "tech-creator-label": "CREADO POR:",
        "tech-soft-label": "SOFTWARES:",
        "tech-year-label": "AÑO:",
        "rights-label": "Derechos: © Sony Pictures (Spider-Man: Across the Spider-Verse) y Metro Boomin.",
        "section-video": "VIDEO",
        "btn-lang": "EN"
      },
      en: {
        "tech-type": "MOTION GRAPHIC MUSIC VIDEO INTRO",
        "tech-title-label": "TITLE:",
        "tech-creator-label": "CREATED BY:",
        "tech-soft-label": "SOFTWARES:",
        "tech-year-label": "YEAR:",
        "rights-label": "Rights: © Sony Pictures (Spider-Man: Across the Spider-Verse) and Metro Boomin.",
        "section-video": "VIDEO",
        "btn-lang": "ES"
      }
    };

    const btnIdioma = document.getElementById('btn-idioma');
    let idiomaActual = localStorage.getItem('idiomaPreferido') || 'es';

    function actualizarTextos() {
      document.querySelectorAll('[data-key]').forEach(el => {
        const clave = el.getAttribute('data-key');
        if (textos[idiomaActual][clave]) {
          el.innerHTML = textos[idiomaActual][clave];
        }
      });
      btnIdioma.textContent = textos[idiomaActual]["btn-lang"];
      localStorage.setItem('idiomaPreferido', idiomaActual);
    }

    btnIdioma.addEventListener('click', () => {
      idiomaActual = (idiomaActual === 'es') ? 'en' : 'es';
      actualizarTextos();
    });

    actualizarTextos();
  </script>
</body>
</html>
