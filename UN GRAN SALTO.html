<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UN GRAN SALTO</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #fff;
      color: #000;
      overflow-x: hidden;
    }

    .hero {
      width: 100%;
      height: 100vh;
      background-image: url("img/IMG_2785.JPG"); 
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .hero h1 {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      font-size: clamp(3rem, 10vw, 10rem); /* Tamaño adaptable */
      font-weight: 900;
      margin: 0;
      color: white;
      text-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .back-arrow {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 2.5rem;
      color: white;
      text-decoration: none;
      z-index: 10;
    }

    .contenido {
      padding: 4rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
      font-weight: 400;
      line-height: 1.6;
    }

    /* SECCIÓN IMÁGENES FINALES (MÁS GRANDES) */
    .imagenes-finales {
      background: white;
      color: black;
      padding: 2rem 0; /* Menos padding para dar espacio a la imagen */
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .imagenes-finales h2 {
      font-size: 3rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    .carousel {
      width: 95vw; /* Casi todo el ancho */
      height: 85vh; /* Casi todo el alto disponible */
      overflow: hidden;
      position: relative;
      background: #000; /* Fondo negro para que resalte el espacio */
      border-radius: 10px;
    }

    .carousel img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Cambiado de contain a cover para llenar todo el recuadro */
      position: absolute;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      pointer-events: none;
    }

    .carousel img.active {
      opacity: 1;
    }

    .final-section {
      background: white;
      text-align: center;
      padding: 6rem 2rem;
    }

    .final-section h1 {
      font-size: 5rem;
      font-weight: 900;
      margin-bottom: 2rem;
    }

    .final-section p {
      font-size: 1.2rem;
      max-width: 800px;
      margin: 0 auto 3rem auto;
    }

    .final-icons img {
      width: 60px;
      height: 60px;
      transition: transform 0.3s;
    }

    .final-icons img:hover {
      transform: scale(1.1);
    }

    /* Ajuste para móviles */
    @media (max-width: 768px) {
      .hero h1 { font-size: 4rem; }
      .carousel { height: 60vh; width: 100vw; border-radius: 0; }
      .final-section h1 { font-size: 3rem; }
    }
  </style>
</head>
<body>

  <div class="hero">
    <a href="PROYECTOS.html" class="back-arrow">←</a>
    <h1>UN GRAN SALTO</h1>
  </div>

  <div class="contenido">
    <p>
      <strong>SHORT FILM ANIMATION</strong> <br> <br>
      <strong>TITLE:</strong> UN GRAN SALTO <br>
      <strong>CREATED BY:</strong> ARANZA ESPINOSA <br>
      <strong>SOFTWARES:</strong> BLENDER, AFTER EFFECTS <br>
      <strong>YEAR:</strong> 2023
    </p>
  </div>

  <section class="imagenes-finales">
    <h2>FINAL IMAGES</h2>
    <div class="carousel">
      <img src="img/IMG_2785.JPG" class="active">
      <img src="IMG_2787.JPG">
      <img src="IMG_2786.JPG">
    </div>
  </section>

  <section class="final-section">
    <h1>THANKS!</h1>
    <p>"Un gran salto" represents a sci-fi history scene, in which an astronaut makes the biggest step of human history.</p>
    <h2>SHORTFILM</h2>
    <div class="final-icons">
      <a href="https://www.behance.net/gallery/193257111/Un-gran-salto" target="_blank">
        <img src="descarga (4).jpg" alt="Behance">
      </a>
    </div>
  </section>

  <script>
    let index = 0;
    const images = document.querySelectorAll('.carousel img');

    function nextImage() {
      images[index].classList.remove('active');
      index = (index + 1) % images.length;
      images[index].classList.add('active');
    }

    setInterval(nextImage, 4000);
  </script>

</body>
</html>
