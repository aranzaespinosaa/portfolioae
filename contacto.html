<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Aranza Espinosa | Contacto</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Variables para iPhone con Notch/Dynamic Island */
      --safe-area-top: env(safe-area-inset-top, 20px);
      --safe-area-bottom: env(safe-area-inset-bottom, 20px);
    }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: white;
      color: black;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background-color: white;
      /* Ajuste dinámico para la parte superior del iPhone */
      padding: calc(var(--safe-area-top) + 10px) 20px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #f0f0f0;
    }

    .nav-bar {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .nav-bar a {
      text-decoration: none;
      color: black;
      font-weight: 400;
      font-size: 0.85rem;
    }

    #btn-idioma {
      background: black;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .logo-header {
      height: 40px; /* Tamaño optimizado para móvil */
      width: auto;
    }

    .contact-label {
      font-weight: 900;
      font-size: 0.85rem;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 30px;
      /* Espacio inferior para evitar el indicador de inicio del iPhone */
      padding-bottom: calc(var(--safe-area-bottom) + 40px);
    }

    .derecha {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      order: 1; /* El nombre y video van primero en móvil */
    }

    .nombre {
      font-size: 2.5rem;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      margin-bottom: 20px;
    }

    .nombre span {
        display: block;
    }

    .nombre span:last-child {
      margin-left: 0; /* Centrado en móvil para mejor estética */
    }

    .video-circulo {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .video-circulo video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      order: 2;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
      width: 100%;
      justify-content: center;
    }

    .icono {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .redes {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .icono2 {
      width: 45px;
      height: 45px;
      object-fit: contain;
    }

    /* --- AJUSTES PARA ESCRITORIO (800px+) --- */
    @media (min-width: 800px) {
      header {
        padding: 1rem 3rem;
      }
      
      .logo-header {
        height: 120px;
      }

      main {
        flex-direction: row;
        justify-content: space-between;
        padding: 4rem;
        align-items: flex-start;
      }

      .derecha {
        width: auto;
        order: 2;
      }

      .nombre {
        font-size: 4rem;
        text-align: left;
      }

      .nombre span:last-child {
        margin-left: 50px; /* Efecto escalonado en escritorio */
      }

      .video-circulo {
        width: 350px;
        height: 350px;
      }

      .info {
        width: auto;
        align-items: flex-start;
        order: 1;
        padding-top: 40px;
      }

      .info-item {
        justify-content: flex-start;
      }

      .redes {
        justify-content: flex-start;
        margin-top: 50px;
      }
    }
  </style>
</head>
<body>

  <header>
    <nav class="nav-bar">
      <a href="index.html" data-key="nav-home">HOME</a>
      <a href="PROYECTOS.html" data-key="nav-projects">PROJECTS</a>
      <button id="btn-idioma">ES</button>
    </nav>
    <img src="AE.jpg" alt="Logo AE" class="logo-header">
    <span class="contact-label" data-key="nav-contact">CONTACT</span>
  </header>

  <main>
    <div class="info">
      <div class="info-item">
        <img src="Mail app icon.jpg" alt="Email" class="icono">
        <span>aranzaespinosarios@gmail.com</span>
      </div>
      <div class="info-item">
        <img src="descarga (6).jpg" alt="Ubicación" class="icono">
        <span data-key="location">Madrid</span>
      </div>

      <div class="redes">
        <a href="https://www.instagram.com/aranza.sht" target="_blank">
          <img src="5cc86c1b-28ef-4e91-9938-93545315adab.jpg" alt="Instagram" class="icono2">
        </a>
        <a href="https://www.linkedin.com/in/aranzaespinosarios" target="_blank">
          <img src="Download Linkedin logo vector, Linkedin symbol, Linkedin icon free vector.jpg" alt="LinkedIn" class="icono2">
        </a>
        <a href="https://www.youtube.com/@aranza_espinosa" target="_blank">
          <img src="descarga (5).jpg" alt="YouTube" class="icono2">
        </a>
        <a href="https://www.behance.net/aranzaespinosa2" target="_blank">
          <img src="descarga (4).jpg" alt="Behance" class="icono">
        </a>
      </div>
    </div>

    <div class="derecha">
      <div class="nombre">
        <span>ARANZA</span>
        <span>ESPINOSA</span>
      </div>
      <div class="video-circulo">
        <video autoplay loop muted playsinline>
          <source src="Comp 1.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </main>

  <script>
    const textos = {
      en: {
        "nav-home": "HOME",
        "nav-projects": "PROJECTS",
        "nav-contact": "CONTACT",
        "location": "Madrid",
        "btn-lang": "ES"
      },
      es: {
        "nav-home": "INICIO",
        "nav-projects": "PROYECTOS",
        "nav-contact": "CONTACTO",
        "location": "Madrid",
        "btn-lang": "EN"
      }
    };

    const btnIdioma = document.getElementById('btn-idioma');
    let idiomaActual = localStorage.getItem('idiomaPreferido') || 'en';

    function actualizarTextos() {
      document.querySelectorAll('[data-key]').forEach(el => {
        const clave = el.getAttribute('data-key');
        if (textos[idiomaActual][clave]) {
          el.textContent = textos[idiomaActual][clave];
        }
      });
      btnIdioma.textContent = textos[idiomaActual]["btn-lang"];
      localStorage.setItem('idiomaPreferido', idiomaActual);
    }

    btnIdioma.addEventListener('click', () => {
      idiomaActual = (idiomaActual === 'en') ? 'es' : 'en';
      actualizarTextos();
    });

    actualizarTextos();
  </script>
</body>
</html>
