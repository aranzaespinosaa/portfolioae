<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GURACHA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            background-color: #000;
            font-family: 'Inter', sans-serif;
            color: white;
            overflow-x: hidden;
        }

        .container {
            height: 100vh;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
        }

        .page {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            overflow: hidden;
        }

        /* Grids (DJ, Infrababy) */
        .grid-layout {
            display: grid;
            gap: 15px;
            width: 100%;
            max-width: 1100px;
            height: 70vh;
            z-index: 2;
        }

        /* Ajuste específico para Alexia para que se vean las 4 fotos */
        .alexia-grid {
            display: grid;
            gap: 10px;
            width: 100%;
            max-width: 900px;
            height: auto; /* Altura automática para evitar cortes */
            max-height: 80vh;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            z-index: 2;
        }

        .grid-layout img, .alexia-grid img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent; /* Fondo transparente */
        }

        /* Carrusel Ajustado sin fondo */
        .carousel-container {
            width: 100%;
            max-width: 850px; 
            height: 65vh;
            position: relative;
            z-index: 2;
            background: transparent; /* Fondo transparente */
        }

        .carousel-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            background: transparent;
        }

        .carousel-container img.active {
            opacity: 1;
        }

        .full-img-contained {
            max-width: 90%;
            max-height: 65vh;
            object-fit: contain;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
        }

        h1 {
            font-weight: 900;
            font-size: clamp(2.5rem, 8vw, 5rem);
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.9;
        }

        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #aaa;
            margin: 10px 0;
        }

        .side-text {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            font-size: 0.6rem;
            letter-spacing: 4px;
            opacity: 0.6;
        }

        .final-full-width {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div class="container">

    <section class="page">
        <div class="content">
            <p class="label">La</p>
            <h1>Guaracha</h1>
            <p class="label">LATINOAMÉRICA & MADRID / 2025</p>
        </div>
    </section>

    <section class="page">
        <div class="grid-layout" style="grid-template-columns: repeat(3, 1fr);">
            <img src="img/ARANZA_ESPINOSA_4.jpg" alt="DJ 1">
            <img src="img/ARANZA_ESPINOSA_5.jpg" alt="DJ 2">
            <img src="img/ARANZA_ESPINOSA_6.jpg" alt="DJ 3">
        </div>
        <p class="label">PIONEER DJ / INSTRUMENTO</p>
    </section>

    <section class="page">
        <div class="side-text">INFRABABY</div>
        <div class="grid-layout" style="grid-template-columns: repeat(3, 1fr);">
            <img src="img/ARANZA_ESPINOSA_22.jpg">
            <img src="img/ARANZA_ESPINOSA.jpg">
            <img src="img/ARANZA_ESPINOSA_3.jpg">
        </div>
    </section>

    <section class="page">
        <div class="side-text">ALEXIA</div>
        <div class="alexia-grid">
            <img src="img/ARANZA_ESPINOSA_9.jpg">
            <img src="img/ARANZA_ESPINOSA_11.jpg">
            <img src="img/ARANZA_ESPINOSA_10.jpg">
            <img src="img/ARANZA_ESPINOSA_8.jpg">
        </div>
        <p class="label" style="margin-top: 15px;">FOTOGRAFÍA ANALÓGICA</p>
    </section>

    <section class="page">
        <div class="carousel-container" id="carousel">
            <img src="img/ARANZA_ESPINOSA_16.jpg" class="active">
            <img src="img/ARANZA_ESPINOSA_21.jpg">
            <img src="img/ARANZA_ESPINOSA_15.jpg">
            <img src="img/ARANZA_ESPINOSA_23.jpg">
            <img src="img/ARANZA_ESPINOSA_14.jpg">
            <img src="img/ARANZA_ESPINOSA_13.jpg">
            <img src="img/ARANZA_ESPINOSA_17.jpg">
            <img src="img/ARANZA_ESPINOSA_24.jpg">
            <img src="img/ARANZA_ESPINOSA_18.jpg">
            <img src="img/ARANZA_ESPINOSA_19.jpg">
        </div>
        <p class="label">PROYECTO COMPLETO 2025</p>
    </section>

    <section class="page">
        <img src="img/ARANZA_ESPINOSA_20.jpg" class="full-img-contained">
        <div class="content">
            <h2 style="font-size: 2.2rem; margin-top: 20px;">FREE PALESTINE</h2>
            <p class="label">STOP GENOCIDE</p>
        </div>
    </section>

    <section class="page" style="padding: 0;">
        <img src="img/ARANZA_ESPINOSA_7.jpg" class="final-full-width">
    </section>

</div>

<script>
    const images = document.querySelectorAll('#carousel img');
    let currentIndex = 0;

    function nextImage() {
        images[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % images.length;
        images[currentIndex].classList.add('active');
    }

    setInterval(nextImage, 5000);
</script>

</body>
</html>
