<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Aranza Espinosa | Proyectos</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: black;
      color: white;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background-color: black;
      padding: calc(var(--safe-top) + 1rem) 0 1rem 0;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      list-style: none;
      padding: 0 2rem;
      margin: 0;
    }

    .nav-bar li { margin: 0 0.5rem; }
    .nav-bar li a, .nav-bar li strong {
      text-decoration: none;
      color: white;
      font-size: 0.9rem;
      font-weight: 400;
      transition: 0.3s;
    }
    .nav-bar li strong { font-weight: 700; }

    #btn-idioma {
      background: white;
      color: black;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .logo-container { flex-grow: 1; text-align: center; }
    .logo { height: clamp(60px, 15vw, 150px); width: auto; }

    .filter-container {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      padding: 1.5rem 1rem;
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 100;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: none;
      border: 1px solid white;
      color: white;
      padding: 0.5rem 1rem;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.65rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: white;
      color: black;
      font-weight: 700;
    }

    /* GRID REFORMADO PARA MANTENER TAMAÑO (IMAGEN 02) */
    main {
      padding: 2rem 1rem;
      display: grid;
      /* Define columnas fijas para mantener la consistencia de la Imagen 02 */
      grid-template-columns: repeat(auto-fill, 220px);
      justify-content: center;
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      min-height: 60vh;
      padding-bottom: calc(var(--safe-bottom) + 2rem);
    }

    .proyecto {
      width: 220px;
      height: 220px;
      position: relative;
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 15px; /* Bordes más redondeados como en Imagen 02 */
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.4s ease, opacity 0.4s ease;
      display: block;
      text-decoration: none;
    }

    /* Eliminamos el efecto de subida/bajada (Imagen 01) para que no se descoloquen */
    .proyecto:nth-child(odd), .proyecto:nth-child(even) { 
      transform: none; 
    }

    .proyecto:hover {
      transform: scale(1.05) !important;
      z-index: 10;
    }

    .proyecto.hidden { display: none; }

    .reparacion { filter: grayscale(1); cursor: not-allowed; }
    .reparacion::before {
      content: "COMING SOON";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.55rem;
      font-weight: 700;
      color: #ff00ff;
      padding: 10px;
      z-index: 2;
    }

    .proyecto::after {
      content: attr(data-title);
      position: absolute;
      bottom: 0; left: 0; width: 100%;
      padding: 0.8rem 0.5rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    @media (max-width: 768px) {
      main {
        /* En móvil usamos 2 columnas fijas para que no se estiren */
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }
      .proyecto {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
      }
      .proyecto::after { opacity: 1; }
    }

    footer {
      background-color: black;
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      border-top: 1px solid #222;
    }
    
    footer a { text-decoration: none; color: white; }

    @media (max-width: 768px) {
      .nav-bar { padding: 0 1rem; }
      footer { flex-direction: column; text-align: center; gap: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <ul class="nav-bar">
        <li><a href="index.html" data-key="nav-home">HOME</a></li>
        <li><strong data-key="nav-projects">PROJECTS</strong></li>
        <li class="logo-container"><img src="AE_BL.png" alt="Logo AE" class="logo"></li>
        <li><a href="contacto.html" data-key="nav-contact">CONTACT</a></li>
        <li><button id="btn-idioma">ES</button></li>
      </ul>
    </nav>
  </header>

  <div class="filter-container">
    <button class="filter-btn active" onclick="filterSelection('all')" data-key="filter-all">ALL</button>
    <button class="filter-btn" onclick="filterSelection('animacion')" data-key="filter-anim">ANIMATION / 3D</button>
    <button class="filter-btn" onclick="filterSelection('apps')" data-key="filter-design">DESIGN</button>
    <button class="filter-btn" onclick="filterSelection('3d-foto')" data-key="filter-photo">PHOTOGRAPHY / VIDEO</button>
  </div>

  <main id="galeria">
    <a href="javascript:void(0)" class="proyecto animacion reparacion" style="background-image: url('img/proyecto1.jpg');" data-title="COMING SOON"></a>
    <a href="OSHI.html" class="proyecto animacion" style="background-image: url('img/PORT_OSHI.jpg');" data-title="OSHI, 2025"></a>
    <a href="SCOPE.html" class="proyecto apps" style="background-image: url('img/scope.png');" data-title="SCOPE, 2023"></a>
    <a href="MISION_17.html" class="proyecto apps" style="background-image: url('VINO_1.png');" data-title="MISIÓN 17, 2026"></a>
    <a href="DRIFT.html" class="proyecto apps" style="background-image: url('DRIFT_LOGO.jpeg');" data-title="DRIFT, 2025"></a>
    <a href="UN GRAN SALTO.html" class="proyecto animacion" style="background-image: url('img/IMG_2785.JPG');" data-title="UN GRAN SALTO, 2023"></a>
    <a href="LINK_UP.html" class="proyecto animacion" style="background-image: url('img/portada metro.png');" data-title="LINK UP, 2024"></a>
    <a href="MODELADO_3D.html" class="proyecto animacion" style="background-image: url('img/537f60d2-435d-4994-b5bd-8bbe04a06641.jpg');" data-title="3D MODELS"></a>
    <a href="GUARACHA.html" class="proyecto 3d-foto" style="background-image: url('img/ARANZA_ESPINOSA_7.jpg');" data-title="LA GUARACHA, 2025"></a>
    <a href="SIETE_VIDAS.html" class="proyecto apps" style="background-image: url('img/b7470938-f4ea-46d4-8928-4031301d42fe_rw_1920.jpg');" data-title="NINE LIVES, 2024"></a>
  </main>

  <footer>
    <p>Aranza Espinosa</p>
    <p><a href="mailto:aranzaespinosarios@gmail.com">aranzaespinosarios@gmail.com</a></p>
  </footer>

  <script>
    function filterSelection(c) {
      const proyectos = document.getElementsByClassName("proyecto");
      const btns = document.getElementsByClassName("filter-btn");
      for (let btn of btns) {
        btn.classList.remove("active");
        if (btn.getAttribute('onclick').includes(`'${c}'`)) {
          btn.classList.add("active");
        }
      }
      for (let i = 0; i < proyectos.length; i++) {
        if (c === "all") {
          proyectos[i].classList.remove("hidden");
        } else {
          if (proyectos[i].classList.contains(c)) {
            proyectos[i].classList.remove("hidden");
          } else {
            proyectos[i].classList.add("hidden");
          }
        }
      }
    }

    const textos = {
      en: {
        "nav-home": "HOME", "nav-projects": "PROJECTS", "nav-contact": "CONTACT",
        "filter-all": "ALL", "filter-anim": "ANIMATION / 3D", "filter-design": "DESIGN",
        "filter-photo": "PHOTOGRAPHY / VIDEO", "btn-lang": "ES"
      },
      es: {
        "nav-home": "INICIO", "nav-projects": "PROYECTOS", "nav-contact": "CONTACTO",
        "filter-all": "TODOS", "filter-anim": "ANIMACIÓN / 3D", "filter-design": "DISEÑO",
        "filter-photo": "FOTOGRAFÍA / VIDEO", "btn-lang": "EN"
      }
    };

    const btnIdioma = document.getElementById('btn-idioma');
    let idiomaActual = localStorage.getItem('idiomaPreferido') || 'en';

    function actualizarTextos() {
      document.querySelectorAll('[data-key]').forEach(el => {
        const clave = el.getAttribute('data-key');
        el.textContent = textos[idiomaActual][clave];
      });
      btnIdioma.textContent = textos[idiomaActual]["btn-lang"];
      localStorage.setItem('idiomaPreferido', idiomaActual);
    }

    btnIdioma.addEventListener('click', () => {
      idiomaActual = (idiomaActual === 'en') ? 'es' : 'en';
      actualizarTextos();
    });

    actualizarTextos();
  </script>
</body>
</html>
